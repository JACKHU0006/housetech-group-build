name: Monthly News Generator

on:
  schedule:
    # 每月 1 号 UTC 02:00 触发（北京时间 10:00）
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date for news (YYYY-MM-DD), default current month'
        required: false
        default: ''
      type:
        description: 'News type (product-launch, technology-innovation, market-event, partnership, award-certification, sustainability), default random'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-news:
    name: Generate Monthly News
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate news article
        id: generate
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date=${{ inputs.date }}"
          fi
          if [ -n "${{ inputs.type }}" ]; then
            ARGS="$ARGS --type=${{ inputs.type }}"
          fi
          node tools/news-auto-generator.js $ARGS

      - name: Build site
        run: npm run build

      - name: Update sitemaps
        if: success()
        run: node update-sitemaps.js

      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(auto): monthly news generation - $(date -u +%Y-%m-%d)"
            git push
            echo "✅ News committed and pushed"
          fi

      - name: Submit to IndexNow
        if: success()
        run: |
          echo "Submitting new URLs to IndexNow..."
          node indexnow.js || echo "IndexNow submission failed (non-critical)"

      - name: Summary
        if: always()
        run: |
          echo "## 📰 Monthly News Generation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git diff --name-only HEAD~1 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "No previous commit to compare" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
