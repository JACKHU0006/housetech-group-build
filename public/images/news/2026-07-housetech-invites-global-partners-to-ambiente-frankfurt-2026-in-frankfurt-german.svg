<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="HouseTech Invites Global Partners to  Ambiente Frankfurt 2026 in Frankfurt, Germany">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="180" height="48" rx="24" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="90" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,0.95)" letter-spacing="3">EXHIBITION</text>
  </g>

  <g transform="translate(80, 180)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="rgba(255,255,255,1)">HouseTech Invites Global</text>
    <text x="0" y="56" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="rgba(255,255,255,1)">Partners to Ambiente Frankfurt</text>
    <text x="0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="rgba(255,255,255,1)">2026 in Frankfurt, Germany</text>
  </g>

  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="120" height="4" fill="rgba(255,255,255,0.7)"/>
    <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.85)">Exhibition</text>
  </g>

  <g transform="translate(900, 200)">
    <circle cx="0" cy="0" r="120" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="0" cy="0" r="90" fill="rgba(255,255,255,0.12)"/>
    <g transform="translate(-60, -60) scale(5)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </g>
  </g>

  <g transform="translate(80, 600)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.95)">HouseTech Group</text>
    <text x="0" y="28" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.7)">Premium OEM/ODM Kitchen Appliances | www.housetech-ch.com</text>
  </g>
</svg>
