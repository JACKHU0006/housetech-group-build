<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0d3d2e"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58d68d"/>
      <stop offset="100%" stop-color="#2ecc71"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="earthGrad" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid -->
  <g opacity="0.05">
    <line x1="0" y1="90" x2="800" y2="90" stroke="#2ecc71" stroke-width="1"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#2ecc71" stroke-width="1"/>
    <line x1="0" y1="270" x2="800" y2="270" stroke="#2ecc71" stroke-width="1"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#2ecc71" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="#2ecc71" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#2ecc71" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="#2ecc71" stroke-width="1"/>
  </g>

  <!-- Earth globe -->
  <g transform="translate(150, 100)" filter="url(#shadow)">
    <circle cx="100" cy="100" r="90" fill="url(#earthGrad)" opacity="0.9"/>
    <!-- Continents simplified -->
    <ellipse cx="80" cy="70" rx="40" ry="30" fill="#27ae60" opacity="0.7"/>
    <ellipse cx="130" cy="110" rx="30" ry="50" fill="#27ae60" opacity="0.7"/>
    <ellipse cx="60" cy="130" rx="20" ry="15" fill="#27ae60" opacity="0.7"/>
    <!-- Globe grid lines -->
    <ellipse cx="100" cy="100" rx="90" ry="30" fill="none" stroke="#85c1e9" stroke-width="0.8" opacity="0.4"/>
    <ellipse cx="100" cy="100" rx="30" ry="90" fill="none" stroke="#85c1e9" stroke-width="0.8" opacity="0.4"/>
    <line x1="10" y1="100" x2="190" y2="100" stroke="#85c1e9" stroke-width="0.8" opacity="0.4"/>
    <line x1="100" y1="10" x2="100" y2="190" stroke="#85c1e9" stroke-width="0.8" opacity="0.4"/>
    <!-- Shine -->
    <ellipse cx="65" cy="65" rx="25" ry="15" fill="#fff" opacity="0.1"/>
  </g>

  <!-- Factory with leaf overlay -->
  <g transform="translate(420, 80)" filter="url(#shadow)">
    <!-- Factory building -->
    <rect x="0" y="80" width="200" height="140" rx="4" fill="#1a5276" stroke="#3498db" stroke-width="1.5"/>
    <!-- Chimney -->
    <rect x="30" y="20" width="25" height="70" rx="2" fill="#1a5276" stroke="#3498db" stroke-width="1"/>
    <rect x="130" y="40" width="25" height="50" rx="2" fill="#1a5276" stroke="#3498db" stroke-width="1"/>
    <!-- Factory windows -->
    <rect x="15" y="100" width="40" height="30" rx="2" fill="#3498db" opacity="0.5"/>
    <rect x="70" y="100" width="40" height="30" rx="2" fill="#3498db" opacity="0.5"/>
    <rect x="125" y="100" width="40" height="30" rx="2" fill="#3498db" opacity="0.5"/>
    <!-- Door -->
    <rect x="85" y="170" width="30" height="50" rx="3" fill="#0a2540"/>
    <!-- Smoke replaced by leaves -->
    <g transform="translate(25, 10)" opacity="0.9">
      <path d="M15,10 Q20,0 25,10 Q30,0 35,10" fill="#2ecc71"/>
    </g>
    <!-- Leaf growing from chimney -->
    <path d="M42,25 Q55,10 42,0 Q55,10 42,25Z" fill="#2ecc71" opacity="0.9"/>
    <path d="M142,40 Q155,25 142,15 Q155,25 142,40Z" fill="#2ecc71" opacity="0.9"/>
  </g>

  <!-- Large leaf icon -->
  <g transform="translate(300, 200)" filter="url(#glow)">
    <path d="M100,180 Q100,100 180,40 Q200,20 180,0 Q150,0 100,60 Q50,0 20,0 Q0,20 20,40 Q100,100 100,180Z" fill="url(#leafGrad)" opacity="0.8"/>
    <!-- Leaf vein -->
    <path d="M100,180 Q100,100 100,40" fill="none" stroke="#27ae60" stroke-width="2" opacity="0.5"/>
    <path d="M100,120 Q70,90 60,60" fill="none" stroke="#27ae60" stroke-width="1.5" opacity="0.4"/>
    <path d="M100,120 Q130,90 140,60" fill="none" stroke="#27ae60" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- CO2 reduction arrow chart -->
  <g transform="translate(620, 100)" filter="url(#shadow)">
    <rect width="150" height="200" rx="6" fill="#0d3d2e" stroke="#2ecc71" stroke-width="1.5" opacity="0.9"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#2ecc71" font-weight="700">CO₂ FOOTPRINT</text>
    <!-- Chart bars -->
    <rect x="15" y="40" width="25" height="140" rx="3" fill="#e74c3c" opacity="0.8"/>
    <rect x="50" y="80" width="25" height="100" rx="3" fill="#f39c12" opacity="0.8"/>
    <rect x="85" y="115" width="25" height="65" rx="3" fill="#f1c40f" opacity="0.8"/>
    <rect x="120" y="150" width="25" height="30" rx="3" fill="#2ecc71" opacity="0.8"/>
    <!-- Down arrow -->
    <path d="M75,165 L75,185 M60,170 L75,185 L90,170" stroke="#2ecc71" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="75" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#2ecc71">-80%</text>
  </g>

  <!-- Green energy symbols: solar, wind -->
  <g transform="translate(50, 300)" opacity="0.7">
    <!-- Solar panel -->
    <rect x="0" y="0" width="60" height="40" rx="2" fill="#1a4a7a" stroke="#3498db" stroke-width="1"/>
    <line x1="0" y1="13" x2="60" y2="13" stroke="#3498db" stroke-width="0.5"/>
    <line x1="0" y1="27" x2="60" y2="27" stroke="#3498db" stroke-width="0.5"/>
    <line x1="15" y1="0" x2="15" y2="40" stroke="#3498db" stroke-width="0.5"/>
    <line x1="30" y1="0" x2="30" y2="40" stroke="#3498db" stroke-width="0.5"/>
    <line x1="45" y1="0" x2="45" y2="40" stroke="#3498db" stroke-width="0.5"/>
    <text x="30" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#3498db">SOLAR</text>
  </g>

  <!-- Wind turbine -->
  <g transform="translate(620, 330)" opacity="0.7">
    <line x1="25" y1="10" x2="25" y2="60" stroke="#5d9cec" stroke-width="2"/>
    <polygon points="25,10 15,35 25,30 35,35" fill="#5d9cec"/>
    <circle cx="25" cy="25" r="4" fill="#3498db"/>
    <text x="25" y="70" text-anchor="middle" font-family="Arial" font-size="8" fill="#5d9cec">WIND</text>
  </g>

  <!-- "CARBON NEUTRAL" text -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="url(#greenAccent)" letter-spacing="4">CARBON NEUTRAL</text>
  <text x="400" y="422" text-anchor="middle" font-family="Arial" font-size="12" fill="#58d68d" letter-spacing="2">MANUFACTURING</text>

  <!-- Brand watermark -->
  <text x="790" y="438" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.4">HouseTech Group</text>
</svg>
