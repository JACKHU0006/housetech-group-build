<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="HouseTech Expands Oven Portfolio with Innovative Auto-Cleaning Technology">
  <defs>
