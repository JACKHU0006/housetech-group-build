    <text x="0" y="56" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="rgba(255,255,255,1)">with Innovative Auto-Cleaning</text>
    <text x="0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="rgba(255,255,255,1)">Technology</text>
  </g>

