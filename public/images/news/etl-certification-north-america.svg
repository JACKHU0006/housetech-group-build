<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0d3052"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a800"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e8a800"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- North America map (simplified) -->
  <g transform="translate(400, 225)" opacity="0.15">
    <!-- USA outline simplified -->
    <path d="M-180,-60 Q-150,-80 -100,-70 Q-50,-90 0,-80 Q50,-70 80,-50 Q100,-30 90,10 Q80,40 60,60 Q30,80 -20,90 Q-80,100 -120,80 Q-160,60 -180,-20 Z" fill="#2d6cb5" stroke="#2d6cb5" stroke-width="1"/>
    <!-- Canada simplified -->
    <path d="M-180,-130 Q-100,-140 -20,-130 Q60,-120 100,-100 Q130,-80 110,-60 Q80,-80 20,-80 Q-60,-70 -140,-90 Z" fill="#2d6cb5"/>
  </g>

  <!-- ETL Certification Seal - Large -->
  <g transform="translate(400, 210)" filter="url(#shadow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="130" fill="#0d2040" stroke="url(#sealGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#e8a800" stroke-width="1" opacity="0.5"/>

    <!-- ETL text arc top -->
    <path id="etlArc" d="M-90,0 A90,90 0 0,1 90,0" fill="none"/>
    <text font-family="Arial Black, Arial" font-size="32" font-weight="900" fill="#ffd700" letter-spacing="4">
      <textPath href="#etlArc" startOffset="50%" text-anchor="middle">ETL</textPath>
    </text>

    <!-- Intertek logo inner (simplified) -->
    <circle cx="0" cy="0" r="85" fill="#0a2540" stroke="#ffd700" stroke-width="1.5" opacity="0.9"/>

    <!-- "INTERTEK" text -->
    <text x="0" y="-35" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#ffd700" letter-spacing="3">INTERTEK</text>

    <!-- "TESTED TO" -->
    <text x="0" y="-15" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa" letter-spacing="1">TESTED TO</text>

    <!-- "UL STANDARDS" -->
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#ffd700" letter-spacing="1">UL STANDARDS</text>

    <!-- Checkmark -->
    <circle cx="0" cy="40" r="25" fill="#2ecc71" opacity="0.2"/>
    <path d="M-12,40 L-4,50 L14,30" fill="none" stroke="#2ecc71" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Bottom text -->
    <text x="0" y="75" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaa" letter-spacing="1">TOTAL QUALITY</text>
    <text x="0" y="87" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaa" letter-spacing="1">ASSURED</text>

    <!-- Star dots around outer ring -->
    <g fill="#ffd700" opacity="0.4">
      <circle cx="-100" cy="-50" r="3"/>
      <circle cx="100" cy="-50" r="3"/>
      <circle cx="-100" cy="50" r="3"/>
      <circle cx="100" cy="50" r="3"/>
      <circle cx="-70" cy="-80" r="3"/>
      <circle cx="70" cy="-80" r="3"/>
    </g>
  </g>

  <!-- "NRTL" label -->
  <g transform="translate(120, 100)">
    <rect width="120" height="40" rx="6" fill="#ffd700" opacity="0.9" filter="url(#shadow)"/>
    <text x="60" y="26" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#0a2540" letter-spacing="2">NRTL</text>
  </g>

  <!-- "LISTED" label -->
  <g transform="translate(560, 100)">
    <rect width="120" height="40" rx="6" fill="#2ecc71" opacity="0.9" filter="url(#shadow)"/>
    <text x="60" y="26" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="white" letter-spacing="2">LISTED</text>
  </g>

  <!-- Safety checkmarks -->
  <g transform="translate(100, 160)" opacity="0.7">
    <circle cx="12" cy="12" r="12" fill="#2ecc71" opacity="0.2"/>
    <path d="M5,12 L10,17 L20,7" fill="none" stroke="#2ecc71" stroke-width="2" stroke-linecap="round"/>
    <text x="38" y="17" font-family="Arial" font-size="10" fill="#5a9fd4">Electrical Safety</text>
  </g>
  <g transform="translate(100, 195)" opacity="0.7">
    <circle cx="12" cy="12" r="12" fill="#2ecc71" opacity="0.2"/>
    <path d="M5,12 L10,17 L20,7" fill="none" stroke="#2ecc71" stroke-width="2" stroke-linecap="round"/>
    <text x="38" y="17" font-family="Arial" font-size="10" fill="#5a9fd4">Fire Prevention</text>
  </g>
  <g transform="translate(100, 230)" opacity="0.7">
    <circle cx="12" cy="12" r="12" fill="#2ecc71" opacity="0.2"/>
    <path d="M5,12 L10,17 L20,7" fill="none" stroke="#2ecc71" stroke-width="2" stroke-linecap="round"/>
    <text x="38" y="17" font-family="Arial" font-size="10" fill="#5a9fd4">Performance Verified</text>
  </g>

  <!-- Bottom text -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="#ffd700" letter-spacing="3">ETL CERTIFICATION</text>
  <text x="400" y="412" text-anchor="middle" font-family="Arial" font-size="12" fill="#aaa" letter-spacing="2">NORTH AMERICA MARKET ACCESS</text>

  <!-- Brand watermark -->
  <text x="790" y="438" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.4">HouseTech Group</text>
</svg>
