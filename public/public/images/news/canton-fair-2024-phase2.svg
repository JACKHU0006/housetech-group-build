<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="60%" stop-color="#0d3052"/>
      <stop offset="100%" stop-color="#1a4a7a"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cc2200"/>
      <stop offset="100%" stop-color="#ff4422"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7931e"/>
      <stop offset="100%" stop-color="#e07010"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Exhibition hall grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="90" x2="800" y2="90" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="270" x2="800" y2="270" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Booth structure -->
  <g transform="translate(180, 60)" filter="url(#shadow)">
    <!-- Back wall -->
    <rect width="440" height="200" rx="4" fill="#0d3052" stroke="#2d6cb5" stroke-width="1.5"/>
    <!-- Roof -->
    <rect x="-10" y="-10" width="460" height="15" rx="3" fill="#f7931e"/>
    <!-- Side walls -->
    <rect x="-10" y="0" width="15" height="200" rx="2" fill="#0d3052" stroke="#2d6cb5" stroke-width="1"/>
    <rect x="435" y="0" width="15" height="200" rx="2" fill="#0d3052" stroke="#2d6cb5" stroke-width="1"/>
    <!-- Booth counter / desk -->
    <rect x="20" y="160" width="150" height="35" rx="4" fill="#1a3a6a" stroke="#2d6cb5" stroke-width="1"/>
    <!-- Display shelves -->
    <rect x="200" y="80" width="80" height="120" rx="3" fill="#0d2040" stroke="#2d6cb5" stroke-width="1"/>
    <rect x="300" y="80" width="80" height="120" rx="3" fill="#0d2040" stroke="#2d6cb5" stroke-width="1"/>
    <!-- Products on shelves -->
    <rect x="215" y="120" width="50" height="70" rx="3" fill="#2d6cb5" opacity="0.5"/>
    <rect x="315" y="120" width="50" height="70" rx="3" fill="#2d6cb5" opacity="0.5"/>
    <!-- HouseTech logo on booth -->
    <text x="220" y="140" font-family="Arial" font-size="14" font-weight="700" fill="#f7931e">HouseTech</text>
    <!-- Spotlight -->
    <circle cx="240" cy="50" r="30" fill="#fff" opacity="0.05"/>
    <circle cx="320" cy="50" r="30" fill="#fff" opacity="0.05"/>
  </g>

  <!-- Chinese flag (stylized) -->
  <g transform="translate(80, 320)" filter="url(#shadow)">
    <rect width="90" height="60" rx="4" fill="#cc2200" opacity="0.9"/>
    <circle cx="22" cy="18" r="8" fill="#ffd700"/>
    <g fill="#ffd700">
      <polygon points="34,14 35,17 38,17 36,19 37,22 34,20 31,22 32,19 30,17 33,17"/>
      <polygon points="28,22 29,24 31,24 29.5,25.5 30,27 28,26 26,27 26.5,25.5 25,24 27,24"/>
      <polygon points="24,27 25,29 27,29 25.5,30.5 26,32 24,31 22,32 22.5,30.5 21,29 23,29"/>
    </g>
  </g>

  <!-- Handshake -->
  <g transform="translate(220, 310)" filter="url(#shadow)">
    <rect width="160" height="90" rx="6" fill="#0d2040" stroke="#f7931e" stroke-width="1.5" opacity="0.9"/>
    <!-- Left hand -->
    <path d="M20,60 Q30,45 50,50 Q60,52 55,60 Q50,68 40,70 Q25,72 20,60Z" fill="#e8c89a" stroke="#c9a87a" stroke-width="1"/>
    <!-- Right hand -->
    <path d="M140,60 Q130,45 110,50 Q100,52 105,60 Q110,68 120,70 Q135,72 140,60Z" fill="#e8c89a" stroke="#c9a87a" stroke-width="1"/>
    <!-- Handshake connection -->
    <path d="M50,55 Q70,48 85,55 Q100,48 110,55" fill="none" stroke="#e8c89a" stroke-width="10" stroke-linecap="round"/>
    <path d="M50,55 Q70,48 85,55 Q100,48 110,55" fill="none" stroke="#d4a87a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Canton Fair text banner -->
  <g transform="translate(500, 340)">
    <rect width="260" height="70" rx="8" fill="#cc2200" opacity="0.9" filter="url(#shadow)"/>
    <text x="130" y="28" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="white" letter-spacing="3">CANTON FAIR</text>
    <text x="130" y="52" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffd700" letter-spacing="2">PHASE 2 · 2024</text>
  </g>

  <!-- Top label -->
  <rect x="250" y="20" width="300" height="40" rx="20" fill="#f7931e" opacity="0.9" filter="url(#shadow)"/>
  <text x="400" y="46" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white" letter-spacing="2">INTERNATIONAL TRADE EXPO</text>

  <!-- Decorative elements -->
  <circle cx="50" cy="225" r="80" fill="#f7931e" opacity="0.05"/>
  <circle cx="750" cy="225" r="80" fill="#cc2200" opacity="0.05"/>

  <!-- Brand watermark -->
  <text x="790" y="438" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.4">HouseTech Group</text>
</svg>
