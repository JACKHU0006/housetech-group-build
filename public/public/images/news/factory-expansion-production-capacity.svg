<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0d3052"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#2d6cb5"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7931e"/>
      <stop offset="100%" stop-color="#e07010"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Factory silhouette left (old) -->
  <g transform="translate(60, 180)" opacity="0.4">
    <rect x="0" y="40" width="140" height="120" rx="3" fill="#1a3a6a"/>
    <rect x="20" y="0" width="30" height="50" rx="2" fill="#1a3a6a"/>
    <rect x="80" y="15" width="25" height="35" rx="2" fill="#1a3a6a"/>
    <rect x="15" y="60" width="30" height="25" rx="2" fill="#0d2040" opacity="0.5"/>
    <rect x="55" y="60" width="30" height="25" rx="2" fill="#0d2040" opacity="0.5"/>
    <rect x="95" y="60" width="30" height="25" rx="2" fill="#0d2040" opacity="0.5"/>
    <text x="70" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="#5a9fd4">BEFORE</text>
  </g>

  <!-- Arrow between -->
  <g transform="translate(220, 210)" filter="url(#glow)">
    <path d="M0,25 L60,25 L60,15 L90,35 L60,55 L60,45 L0,45 Z" fill="#f7931e" opacity="0.9"/>
  </g>

  <!-- New expanded factory -->
  <g transform="translate(330, 120)" filter="url(#shadow)">
    <!-- Main building -->
    <rect x="0" y="80" width="280" height="160" rx="4" fill="#0d3052" stroke="#2d6cb5" stroke-width="1.5"/>
    <!-- New wing extension (highlighted) -->
    <rect x="280" y="120" width="150" height="120" rx="4" fill="#0a2540" stroke="#f7931e" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="355" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#f7931e" font-weight="700">NEW WING</text>

    <!-- Chimneys -->
    <rect x="30" y="20" width="30" height="70" rx="3" fill="#1a4a7a" stroke="#2d6cb5" stroke-width="1"/>
    <rect x="90" y="40" width="25" height="50" rx="3" fill="#1a4a7a" stroke="#2d6cb5" stroke-width="1"/>
    <rect x="200" y="30" width="30" height="60" rx="3" fill="#1a4a7a" stroke="#2d6cb5" stroke-width="1"/>

    <!-- Windows rows -->
    <rect x="15" y="100" width="40" height="30" rx="2" fill="#3498db" opacity="0.4"/>
    <rect x="65" y="100" width="40" height="30" rx="2" fill="#3498db" opacity="0.4"/>
    <rect x="115" y="100" width="40" height="30" rx="2" fill="#3498db" opacity="0.4"/>
    <rect x="165" y="100" width="40" height="30" rx="2" fill="#3498db" opacity="0.4"/>
    <rect x="215" y="100" width="50" height="30" rx="2" fill="#3498db" opacity="0.4"/>

    <rect x="15" y="145" width="40" height="30" rx="2" fill="#3498db" opacity="0.4"/>
    <rect x="65" y="145" width="40" height="30" rx="2" fill="#3498db" opacity="0.4"/>
    <rect x="115" y="145" width="40" height="30" rx="2" fill="#3498db" opacity="0.4"/>
    <rect x="165" y="145" width="40" height="30" rx="2" fill="#3498db" opacity="0.4"/>
    <rect x="215" y="145" width="50" height="30" rx="2" fill="#3498db" opacity="0.4"/>

    <!-- Loading dock -->
    <rect x="295" y="185" width="40" height="55" rx="2" fill="#0a2540" stroke="#2d6cb5" stroke-width="1"/>
    <rect x="355" y="185" width="40" height="55" rx="2" fill="#0a2540" stroke="#2d6cb5" stroke-width="1"/>

    <!-- Door -->
    <rect x="120" y="200" width="40" height="40" rx="3" fill="#0a2540"/>
  </g>

  <!-- Production capacity chart -->
  <g transform="translate(540, 80)" filter="url(#shadow)">
    <rect width="230" height="260" rx="6" fill="#0d2040" stroke="#2d6cb5" stroke-width="1.5" opacity="0.9"/>
    <text x="115" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#5a9fd4" font-weight="700" letter-spacing="1">PRODUCTION CAPACITY</text>

    <!-- Y axis labels -->
    <text x="15" y="55" font-family="Arial" font-size="8" fill="#5a9fd4">+200%</text>
    <text x="15" y="110" font-family="Arial" font-size="8" fill="#5a9fd4">+100%</text>
    <text x="25" y="165" font-family="Arial" font-size="8" fill="#5a9fd4">BASE</text>

    <!-- Grid lines -->
    <line x1="50" y1="50" x2="220" y2="50" stroke="#2d6cb5" stroke-width="0.5" opacity="0.3"/>
    <line x1="50" y1="105" x2="220" y2="105" stroke="#2d6cb5" stroke-width="0.5" opacity="0.3"/>
    <line x1="50" y1="160" x2="220" y2="160" stroke="#2d6cb5" stroke-width="0.5" opacity="0.3"/>

    <!-- Bars: OLD vs NEW -->
    <text x="85" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#5a9fd4">2023</text>
    <rect x="55" y="120" width="60" height="40" rx="3" fill="#2d6cb5" opacity="0.7"/>
    <text x="85" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#5a9fd4">1x</text>

    <text x="185" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#f7931e">2026</text>
    <rect x="155" y="50" width="60" height="110" rx="3" fill="url(#orangeAccent)"/>
    <text x="185" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#f7931e" font-weight="700">3x</text>

    <!-- Up arrow -->
    <path d="M210,55 L210,95 M200,65 L210,55 L220,65" stroke="#2ecc71" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- "FACTORY EXPANSION" text -->
  <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="url(#orangeAccent)" letter-spacing="3">FACTORY EXPANSION</text>
  <text x="400" y="425" text-anchor="middle" font-family="Arial" font-size="12" fill="#5a9fd4" letter-spacing="2">PRODUCTION CAPACITY UPGRADE</text>

  <!-- Brand watermark -->
  <text x="790" y="438" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.4">HouseTech Group</text>
</svg>
