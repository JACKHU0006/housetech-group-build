<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a2540;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7931e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e88b1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Stylized H with house/kitchen hood shape -->
  <g transform="translate(4, 8)">
    <!-- House/Hood outline shape -->
    <path d="M6 28 L24 12 L42 28 L42 44 L30 44 L30 32 L18 32 L18 44 L6 44 Z" 
          fill="url(#grad1)" stroke="url(#accentGrad)" stroke-width="2"/>
    <!-- HT monogram hint inside -->
    <text x="24" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" 
          font-size="16" fill="#f7931e">HT</text>
  </g>

  <!-- Brand Text -->
  <text x="56" y="36" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" font-size="28" fill="#0a2540" letter-spacing="-0.5">
    HouseTech
  </text>
  
  <!-- GROUP subtitle -->
  <text x="57" y="56" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="600" font-size="11" fill="#f7931e" letter-spacing="2.5">
    GROUP
  </text>
  
  <!-- Tagline -->
  <text x="57" y="70" font-family="'Inter', -apple-system, sans-serif" 
        font-weight="400" font-size="8" fill="#718096" letter-spacing="0.5">
    Kitchen Appliance Manufacturer
  </text>
</svg>