<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0d3052"/>
    </linearGradient>
    <linearGradient id="ifaBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#2d6cb5"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7931e"/>
      <stop offset="100%" stop-color="#e07010"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- IFA brand bar -->
  <rect x="0" y="0" width="800" height="50" fill="#0a2540" rx="12"/>
  <rect x="0" y="25" width="800" height="25" fill="#0a2540"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial Black, Arial" font-size="26" font-weight="900" fill="#2d6cb5" letter-spacing="8">IFA</text>
  <text x="400" y="46" text-anchor="middle" font-family="Arial" font-size="10" fill="#5a9fd4" letter-spacing="4">BERLIN 2024</text>

  <!-- Berlin TV Tower -->
  <g transform="translate(80, 80)" filter="url(#shadow)" opacity="0.7">
    <!-- Tower base -->
    <rect x="35" y="120" width="30" height="160" rx="2" fill="#1a3a6a"/>
    <!-- Sphere -->
    <circle cx="50" cy="100" r="35" fill="#1a3a6a" stroke="#2d6cb5" stroke-width="1.5"/>
    <circle cx="50" cy="100" r="25" fill="#0d2040"/>
    <!-- Antenna -->
    <line x1="50" y1="65" x2="50" y2="20" stroke="#2d6cb5" stroke-width="3"/>
    <line x1="50" y1="20" x2="50" y2="5" stroke="#2d6cb5" stroke-width="2"/>
    <!-- Antenna top light -->
    <circle cx="50" cy="5" r="3" fill="#e74c3c" opacity="0.8" filter="url(#glow)"/>
    <!-- Sphere window dots -->
    <circle cx="40" cy="90" r="3" fill="#2d6cb5" opacity="0.5"/>
    <circle cx="50" cy="85" r="3" fill="#2d6cb5" opacity="0.5"/>
    <circle cx="60" cy="90" r="3" fill="#2d6cb5" opacity="0.5"/>
    <circle cx="45" cy="100" r="3" fill="#2d6cb5" opacity="0.5"/>
    <circle cx="55" cy="100" r="3" fill="#2d6cb5" opacity="0.5"/>
    <circle cx="50" cy="110" r="3" fill="#2d6cb5" opacity="0.5"/>
    <!-- Brand label -->
    <text x="50" y="290" text-anchor="middle" font-family="Arial" font-size="9" fill="#5a9fd4">BERLIN</text>
  </g>

  <!-- Success data panel -->
  <g transform="translate(500, 80)" filter="url(#shadow)">
    <rect width="260" height="260" rx="8" fill="#0d2040" stroke="#2d6cb5" stroke-width="1.5" opacity="0.9"/>
    <text x="130" y="30" text-anchor="middle" font-family="Arial" font-size="12" fill="#f7931e" font-weight="700" letter-spacing="2">EXHIBITION SUCCESS</text>

    <!-- Stat rows -->
    <g transform="translate(15, 50)">
      <rect width="230" height="45" rx="4" fill="#1a3a6a" opacity="0.5"/>
      <text x="15" y="22" font-family="Arial" font-size="9" fill="#5a9fd4">ATTENDEES</text>
      <text x="15" y="38" font-family="Arial Black, Arial" font-size="22" fill="#fff" font-weight="900">215K+</text>
      <text x="200" y="32" font-family="Arial" font-size="20" fill="#2ecc71" font-weight="700">↑ 18%</text>
    </g>
    <g transform="translate(15, 105)">
      <rect width="230" height="45" rx="4" fill="#1a3a6a" opacity="0.5"/>
      <text x="15" y="22" font-family="Arial" font-size="9" fill="#5a9fd4">EXHIBITORS</text>
      <text x="15" y="38" font-family="Arial Black, Arial" font-size="22" fill="#fff" font-weight="900">1,800+</text>
      <text x="200" y="32" font-family="Arial" font-size="20" fill="#2ecc71" font-weight="700">↑ 12%</text>
    </g>
    <g transform="translate(15, 160)">
      <rect width="230" height="45" rx="4" fill="#1a3a6a" opacity="0.5"/>
      <text x="15" y="22" font-family="Arial" font-size="9" fill="#5a9fd4">LEADS GENERATED</text>
      <text x="15" y="38" font-family="Arial Black, Arial" font-size="22" fill="#f7931e" font-weight="900">500+</text>
      <text x="200" y="32" font-family="Arial" font-size="20" fill="#ffd700" font-weight="700">★</text>
    </g>
    <g transform="translate(15, 215)">
      <rect width="230" height="35" rx="4" fill="#1a3a6a" opacity="0.5"/>
      <text x="15" y="22" font-family="Arial" font-size="9" fill="#5a9fd4">HALL</text>
      <text x="180" y="22" font-family="Arial" font-size="9" fill="#f7931e" font-weight="700">HALLE 3.1</text>
    </g>
  </g>

  <!-- Mini booth illustration center -->
  <g transform="translate(200, 300)" filter="url(#shadow)" opacity="0.9">
    <rect width="260" height="120" rx="4" fill="#0d3052" stroke="#2d6cb5" stroke-width="1.5"/>
    <rect x="-8" y="-8" width="276" height="15" rx="3" fill="#f7931e"/>
    <text x="130" y="5" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="700">HouseTech</text>
    <rect x="15" y="30" width="100" height="60" rx="3" fill="#0a2540" stroke="#2d6cb5" stroke-width="1"/>
    <rect x="130" y="30" width="50" height="60" rx="3" fill="#0a2540" stroke="#2d6cb5" stroke-width="1"/>
    <rect x="195" y="30" width="50" height="60" rx="3" fill="#0a2540" stroke="#2d6cb5" stroke-width="1"/>
    <rect x="15" y="95" width="230" height="20" rx="2" fill="#1a3a6a"/>
    <text x="130" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#5a9fd4">Smart Kitchen Innovation</text>
  </g>

  <!-- Bottom text -->
  <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#2d6cb5" letter-spacing="3">IFA BERLIN 2024</text>
  <text x="400" y="425" text-anchor="middle" font-family="Arial" font-size="12" fill="#f7931e" letter-spacing="2">EXHIBITION SUCCESS</text>

  <!-- Brand watermark -->
  <text x="790" y="438" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.4">HouseTech Group</text>
</svg>
