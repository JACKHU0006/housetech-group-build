    <circle cx="60" cy="-30" r="8" fill="#f7931e" opacity="0.8"/><circle cx="80" cy="10" r="6" fill="#f7931e" opacity="0.7"/>
    <circle cx="50" cy="45" r="7" fill="#f7931e" opacity="0.75"/><circle cx="0" cy="50" r="6" fill="#f7931e" opacity="0.7"/>
