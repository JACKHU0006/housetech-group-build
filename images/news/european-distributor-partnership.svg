    <circle cx="30" cy="10" r="5" fill="#f7931e" opacity="0.65"/>
    <!-- Connection lines -->
    <g stroke="rgba(255,255,255,0.15)" stroke-width="1">
      <line x1="-40" y1="-40" x2="20" y2="-50"/><line x1="20" y1="-50" x2="60" y2="-30"/>
