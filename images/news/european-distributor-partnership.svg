      <line x1="50" y1="45" x2="0" y2="50"/><line x1="0" y1="50" x2="-30" y2="25"/>
      <line x1="-30" y1="25" x2="-60" y2="-5"/><line x1="-60" y1="-5" x2="-40" y2="-40"/>
      <line x1="-40" y1="-40" x2="30" y2="10"/><line x1="60" y1="-30" x2="0" y2="50"/>
      <line x1="20" y1="-50" x2="-30" y2="25"/><line x1="80" y1="10" x2="-60" y2="-5"/>
    </g>
