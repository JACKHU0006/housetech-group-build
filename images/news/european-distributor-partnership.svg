  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4f46e5"/><stop offset="100%" style="stop-color:#3730a3"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <g transform="translate(400, 190)">
